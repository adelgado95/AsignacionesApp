# nginx reverse proxy for the Django backend (gunicorn on 127.0.0.1:8000).
# Install:
#   sudo cp deploy/nginx-central.admincong.online.conf /etc/nginx/sites-available/central.admincong.online
#   sudo ln -s /etc/nginx/sites-available/central.admincong.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS afterwards (certbot adds the 443 block and the http -> https redirect to this file):
#   sudo certbot --nginx -d central.admincong.online

server {
    listen 80;
    listen [::]:80;
    server_name central.admincong.online;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;      # change the port if you deployed with --port
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;              # gunicorn --timeout is 60
        proxy_send_timeout    60s;
    }
}
